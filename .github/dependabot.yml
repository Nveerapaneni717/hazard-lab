version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Keeps the actions in ci.yml and codeql.yml current. Dependabot follows the
  # reference style already in use -- these are pinned by tag, so it proposes
  # newer tags and will never convert them to SHA pins on its own.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
