name: Bug report
description: Something produces a wrong number, an error, or unexpected behaviour
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include credentials, absolute paths containing your
        username, or any personal data. This project never needs them.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: |
        For numerical issues, say what value you expected and why. A number
        that looks plausible but is wrong is the most valuable kind of report
        here, and the hardest to spot.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Smallest snippet or command that shows it.
      render: python
    validations:
      required: true

  - type: input
    id: hazard
    attributes:
      label: Hazard
      description: Which spec, if relevant (elnino, earthquake, your own...)

  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Python and hazard-lab version, e.g. 3.12 / 0.1.0"
    validations:
      required: true
