name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only ever needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Full Python spread on Linux, plus one run each on Windows and macOS.
    # Most of this project's readers are on Windows, so "it works on Linux" is
    # not the guarantee that matters to them.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false      # do not leave a usable token on disk

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # Install the package itself, not just its dependencies. Without this,
        # `python examples/...` puts examples/ on sys.path rather than the repo
        # root and the import fails -- which is exactly what a fresh clone does.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Quickstart smoke test
        run: |
          python examples/01_quickstart.py --sims 500
          python examples/01_quickstart.py --hazard indian_monsoon --sims 500

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0                  # gitleaks needs history

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # One documented false positive is allowlisted; see .gitleaks.toml.
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit
          pip-audit --strict

  # Single stable check for branch protection to require.
  #
  # Without this, the ruleset has to name every matrix leg -- "test (ubuntu-latest,
  # 3.12)" and so on -- and any change to the matrix silently blocks every merge
  # until someone notices the required check no longer exists. Requiring this one
  # job instead means the matrix can change freely.
  ci-complete:
    if: always()
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "one or more CI jobs did not succeed"
          exit 1
      - run: echo "all CI jobs succeeded"
