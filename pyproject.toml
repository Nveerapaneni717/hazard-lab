[project]
name = "hazard-lab"
version = "0.1.0"
description = "A hazard-agnostic skeleton for probabilistic catastrophe modelling."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Nishanth Veerapaneni" }]
keywords = ["catastrophe-modelling", "actuarial", "extreme-value", "monte-carlo"]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pip-audit>=2.7", "pre-commit>=3.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hazardlab", "hazardlab.io", "hazardlab.features",
            "hazardlab.models", "hazardlab.impact", "hazardlab.hazards"]

[tool.setuptools.package-data]
hazardlab = ["data/*.csv", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]        # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]  # imports after warnings filter, on purpose

[tool.pytest.ini_options]
testpaths = ["tests"]
